name: daily check

on:
  schedule:
    - cron: "0 22 * * *"  # 22:00 UTC = 07:00 KST
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[llm]"

      - name: Run daily scan
        env:
          HOME_AGENT_MOLIT_API_KEY: ${{ secrets.HOME_AGENT_MOLIT_API_KEY }}
          HOME_AGENT_GEMINI_API_KEY: ${{ secrets.HOME_AGENT_GEMINI_API_KEY }}
          HOME_AGENT_LH_API_KEY: ${{ secrets.HOME_AGENT_LH_API_KEY }}
        run: python -m home_agent.daily_check

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/seen_notices.json data/reports/_daily/
          git diff --cached --quiet || git commit -m "chore: daily scan results ($(date -u +%F))"
          git push
